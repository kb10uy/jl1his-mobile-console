[package]
name = "app"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[dependencies]
cortex-m = { version = "0.7.7", features = ["inline-asm"] }
cortex-m-rt = "0.7.5"
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-rp = { version = "0.10.0", features = ["rp235xa", "time-driver", "critical-section-impl", "binary-info"] }
embassy-time = "0.5.1"
embedded-graphics = "0.8.2"
embedded-hal-bus = { version = "0.3.0", features = ["async"] }
heapless = "0.9.3"
panic-halt = "1.0.0"
static_cell = "2.1.1"

font-shinonome = { path = "../core/font-shinonome" }
ssd1351 = { path = "../core/ssd1351" }
textdraw = { path = "../core/textdraw" }

[profile.release]
debug = 2
lto = true
